name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 发布单文件 exe
        run: dotnet publish src/BatteryTray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path publish\BatteryTray.exe -DestinationPath BatteryTray-win-x64.zip

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: BatteryTray-win-x64.zip
          generate_release_notes: true
